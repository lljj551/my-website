      // ---------------------------------------------------------------------
      // Boss：沼泽巨僵
      // ---------------------------------------------------------------------
      function stunPlayer(duration) {
        player.stunTimer = Math.max(player.stunTimer, duration);
        player.dashTimer = 0;
        player.dashTrail = [];
        player.dashFromX = player.x;
        player.dashToX = player.x;
        downKeys.clear();
      }

      function spawnBossProjectile(kind) {
        if (!boss || boss.defeated) return null;

        const giant = kind === "giant";
        const projectile = {
          x: BOSS_X - 122,
          y: clamp(player.y, ARENA.y + 24, ARENA.bottom - 24),
          vx: giant ? -232 : -350,
          radius: giant ? 52 : 19,
          damage: giant ? 2 : 1,
          kind,
          phase: rand(0, TAU),
          life: 8,
        };
        bossProjectiles.push(projectile);

        burstParticles(
          projectile.x,
          projectile.y,
          giant ? "#ffb06a" : "#ff8d72",
          giant ? 20 : 10,
          {
            speed: giant ? 200 : 120,
            size: giant ? 5.5 : 3.2,
            life: 0.5,
            gravity: 0,
            drag: 0.92,
          }
        );

        return projectile;
      }

      function performBossAttack(index) {
        if (!boss || boss.defeated || game.status !== "playing") return;

        boss.attackAnim = 0.62;
        const skill = index % 3;

        if (skill === 0) {
          spawnBossProjectile("giant");
          game.shake = Math.max(game.shake, 6);
          addFloater(
            "巨能弹！",
            BOSS_X - 180,
            BOSS_Y - 205,
            "#ffb37c",
            18
          );
          return;
        }

        if (skill === 1) {
          boss.roarTimer = 1.2;
          game.roarFlash = 0.72;
          game.shake = 26;
          stunPlayer(BOSS_STUN_DURATION);
          sfxBossRoar();

          addFloater(
            "吼！！！",
            BOSS_X - 250,
            BOSS_Y - 185,
            "#ff7069",
            38
          );
          addFloater(
            "眩晕 2 秒",
            player.x,
            player.y - 82,
            "#ffd58f",
            18
          );
          burstParticles(BOSS_X - 80, BOSS_Y - 80, "#ff6c62", 34, {
            speed: 320,
            size: 6,
            life: 0.8,
            gravity: -20,
            drag: 0.93,
          });
          return;
        }

        boss.volleyRemaining = 3;
        boss.volleyTimer = 0.05;
        addFloater(
          "三连弹幕！",
          BOSS_X - 205,
          BOSS_Y - 200,
          "#ffc278",
          17
        );
      }

      function updateBoss(dt) {
        if (
          !boss ||
          game.level !== 4 ||
          game.status !== "playing" ||
          game.levelIntroTimer > 0
        ) {
          return;
        }

        boss.animTime += dt;
        boss.attackAnim = Math.max(0, boss.attackAnim - dt);
        boss.roarTimer = Math.max(0, boss.roarTimer - dt);
        boss.hitFlash = Math.max(0, boss.hitFlash - dt);

        if (boss.volleyRemaining > 0) {
          boss.volleyTimer -= dt;
          if (boss.volleyTimer <= 0) {
            spawnBossProjectile("barrage");
            boss.volleyRemaining -= 1;
            boss.volleyTimer = 0.3;
          }
        }

        boss.attackTimer -= dt;
        if (boss.attackTimer <= 0) {
          performBossAttack(boss.attackIndex);
          boss.attackIndex = (boss.attackIndex + 1) % 3;
          boss.attackTimer = BOSS_ATTACK_INTERVAL;
        }
      }

      function updateBossProjectiles(dt) {
        for (let i = bossProjectiles.length - 1; i >= 0; i -= 1) {
          const projectile = bossProjectiles[i];
          projectile.life -= dt;
          projectile.phase += dt * 8;
          projectile.x += projectile.vx * dt;

          if (Math.random() < dt * 10) {
            addParticle({
              x: projectile.x + rand(-projectile.radius * 0.5, projectile.radius * 0.5),
              y: projectile.y + rand(-projectile.radius * 0.5, projectile.radius * 0.5),
              vx: rand(-20, 20),
              vy: rand(-20, 20),
              gravity: 0,
              drag: 0.9,
              size: rand(2, 4.5),
              color:
                projectile.kind === "giant"
                  ? "rgba(255, 152, 106, 0.55)"
                  : "rgba(255, 118, 104, 0.45)",
              life: rand(0.2, 0.45),
              glow: true,
            });
          }

          const hit =
            Math.hypot(
              projectile.x - player.x,
              projectile.y - player.y
            ) <
            projectile.radius + player.radius;

          if (hit) {
            hurtPlayer(projectile.damage);
            burstParticles(
              projectile.x,
              projectile.y,
              projectile.kind === "giant" ? "#ffc17b" : "#ff8a7b",
              projectile.kind === "giant" ? 20 : 11,
              {
                speed: 220,
                size: 4.4,
                life: 0.55,
                gravity: 80,
                drag: 0.93,
              }
            );
            game.shake = Math.max(
              game.shake,
              projectile.kind === "giant" ? 9 : 4
            );
            bossProjectiles.splice(i, 1);
            continue;
          }

          if (projectile.x < -80 || projectile.life <= 0) {
            bossProjectiles.splice(i, 1);
          }
        }
      }

      function damageBoss(amount, source = {}) {
        if (
          !boss ||
          boss.defeated ||
          game.level !== 4 ||
          game.status !== "playing"
        ) {
          return;
        }

        boss.hp = Math.max(0, boss.hp - amount);
        boss.hitFlash = 0.16;
        game.shake = Math.max(game.shake, source.type === "ultimate" ? 7 : 3);
        if (source.type === "projectile") {
          sfxHitZombie();
        }

        const hitX = source.x === undefined ? BOSS_X - 105 : source.x;
        const hitY = source.y === undefined ? BOSS_Y - 20 : source.y;
        addFloater(
          `-${amount}`,
          hitX + rand(-16, 16),
          hitY - 38,
          source.type === "ultimate" ? "#fff3aa" : "#ffd7a3",
          18,
          MONO_STACK
        );
        burstParticles(
          hitX,
          hitY,
          source.type === "ultimate" ? "#ffe58e" : "#baffca",
          source.type === "ultimate" ? 20 : 10,
          {
            speed: source.type === "ultimate" ? 280 : 170,
            size: 4.3,
            life: 0.55,
            gravity: 95,
            drag: 0.93,
          }
        );

        if (boss.hp <= 0) {
          defeatBoss();
        }
      }

      function defeatBoss() {
        if (!boss || boss.defeated) return;
        boss.defeated = true;
        boss.hp = 0;
        game.kills += 1;
        game.status = "victory";
        game.paused = false;
        game.victoryTimer = 0;
        game.shake = 30;
        game.ultimateFlash = 0.5;
        downKeys.clear();
        bossProjectiles = [];
        player.stunTimer = 0;
        player.dashTimer = 0;

        burstParticles(BOSS_X - 60, BOSS_Y - 40, "#ffe16f", 70, {
          speed: 420,
          size: 7,
          life: 1.3,
          gravity: 160,
          drag: 0.96,
        });
        burstParticles(BOSS_X - 60, BOSS_Y - 40, "#89ffb2", 42, {
          speed: 300,
          size: 5,
          life: 1,
          gravity: 100,
          drag: 0.95,
        });
      }

      function drawBoss() {
        if (!boss) return;

        const breathe = Math.sin(boss.animTime * 1.7) * 3;
        const attackProgress =
          boss.attackAnim > 0 ? 1 - boss.attackAnim / 0.62 : 0;
        const attackKick =
          boss.attackAnim > 0
            ? Math.sin(attackProgress * Math.PI) * -13
            : 0;
        const roar =
          boss.roarTimer > 0
            ? Math.sin(
                clamp(1 - boss.roarTimer / 1.2, 0, 1) * Math.PI
              )
            : 0;
        const warning =
          boss.attackTimer < 0.9 && boss.volleyRemaining === 0;
        const warningPulse = warning
          ? 0.5 + 0.5 * Math.sin(sceneTime * 10)
          : 0;

        ctx.save();

        // 地面阴影
        ctx.globalAlpha = 0.42;
        ctx.fillStyle = "#000000";
        ctx.beginPath();
        ctx.ellipse(
          boss.x + attackKick * 0.3,
          boss.y + 192,
          142,
          26,
          0,
          0,
          TAU
        );
        ctx.fill();
        ctx.globalAlpha = 1;

        // 蓄力 / 咆哮光环
        if (warning || roar > 0) {
          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          const aura = ctx.createRadialGradient(
            boss.x - 40,
            boss.y - 40,
            20,
            boss.x - 40,
            boss.y - 40,
            240
          );
          aura.addColorStop(
            0,
            `rgba(255, 114, 93, ${0.13 + warningPulse * 0.09 + roar * 0.12})`
          );
          aura.addColorStop(
            0.55,
            `rgba(255, 77, 71, ${0.04 + warningPulse * 0.03 + roar * 0.05})`
          );
          aura.addColorStop(1, "rgba(255, 60, 60, 0)");
          ctx.fillStyle = aura;
          ctx.beginPath();
          ctx.arc(boss.x - 40, boss.y - 40, 240, 0, TAU);
          ctx.fill();
          ctx.restore();
        }

        ctx.translate(
          boss.x + attackKick,
          boss.y + breathe
        );
        ctx.scale(1 + roar * 0.025, 1 + roar * 0.025);

        if (boss.hitFlash > 0) {
          ctx.filter = "brightness(1.75) saturate(0.7)";
        }

        // 破败披风
        const capeGradient = ctx.createLinearGradient(0, -120, 0, 200);
        capeGradient.addColorStop(0, "#47335f");
        capeGradient.addColorStop(1, "#24182f");
        ctx.fillStyle = capeGradient;
        ctx.strokeStyle = "#1b1322";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-110, -100);
        ctx.quadraticCurveTo(-155, 25, -142, 194);
        ctx.lineTo(-104, 168);
        ctx.lineTo(-74, 205);
        ctx.lineTo(-38, 172);
        ctx.lineTo(0, 207);
        ctx.lineTo(40, 172);
        ctx.lineTo(82, 205);
        ctx.lineTo(112, 168);
        ctx.lineTo(144, 194);
        ctx.quadraticCurveTo(157, 20, 108, -100);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // 脚与腿
        ctx.fillStyle = "#4b8b49";
        ctx.strokeStyle = "#1b3d29";
        ctx.lineWidth = 4;
        for (const side of [-1, 1]) {
          ctx.beginPath();
          ctx.ellipse(side * 48, 179, 39, 22, side * 0.1, 0, TAU);
          ctx.fill();
          ctx.stroke();
        }

        // 巨大身体
        const bodyGradient = ctx.createRadialGradient(
          -38,
          -30,
          20,
          0,
          50,
          150
        );
        bodyGradient.addColorStop(0, "#9bdf72");
        bodyGradient.addColorStop(0.45, "#6fbc5e");
        bodyGradient.addColorStop(1, "#3f7c43");
        ctx.fillStyle = bodyGradient;
        ctx.strokeStyle = "#193b29";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.ellipse(0, 54, 105, 135, 0, 0, TAU);
        ctx.fill();
        ctx.stroke();

        // 腹部
        ctx.fillStyle = "rgba(41, 80, 44, 0.62)";
        ctx.beginPath();
        ctx.ellipse(0, 76, 65, 86, 0, 0, TAU);
        ctx.fill();

        // 破损王甲
        ctx.fillStyle = "#4b3a2a";
        ctx.strokeStyle = "#201b17";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-78, -28);
        ctx.quadraticCurveTo(0, -62, 78, -28);
        ctx.lineTo(69, 55);
        ctx.lineTo(36, 39);
        ctx.lineTo(9, 69);
        ctx.lineTo(-21, 37);
        ctx.lineTo(-52, 61);
        ctx.lineTo(-72, 45);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.strokeStyle = "#c69b47";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-62, -10);
        ctx.lineTo(-48, 28);
        ctx.moveTo(62, -10);
        ctx.lineTo(48, 28);
        ctx.stroke();

        // 胸口能量核心
        const corePulse =
          0.8 + Math.sin(sceneTime * 4.2 + boss.phase) * 0.2;
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        const coreGlow = ctx.createRadialGradient(0, 42, 2, 0, 42, 40);
        coreGlow.addColorStop(0, `rgba(255, 240, 155, ${0.8 * corePulse})`);
        coreGlow.addColorStop(0.28, `rgba(255, 151, 92, ${0.55 * corePulse})`);
        coreGlow.addColorStop(1, "rgba(255, 93, 70, 0)");
        ctx.fillStyle = coreGlow;
        ctx.beginPath();
        ctx.arc(0, 42, 40 * corePulse, 0, TAU);
        ctx.fill();
        ctx.restore();

        ctx.fillStyle = "#5e241f";
        ctx.strokeStyle = "#e5b95f";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 42, 13, 0, TAU);
        ctx.fill();
        ctx.stroke();

        // 手臂
        const armLift =
          boss.attackAnim > 0
            ? Math.sin(attackProgress * Math.PI) * 48
            : 0;
        const armWave = Math.sin(boss.animTime * 2.1) * 5;
        const hands = [
          {
            x: -143,
            y: 74 - armLift + armWave,
            side: -1,
          },
          {
            x: 139,
            y: 83 - armLift * 0.7 - armWave,
            side: 1,
          },
        ];

        for (const hand of hands) {
          ctx.strokeStyle = "#173725";
          ctx.lineWidth = 38;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(hand.side * 76, -36);
          ctx.quadraticCurveTo(
            hand.side * 132,
            -12,
            hand.x,
            hand.y
          );
          ctx.stroke();

          ctx.strokeStyle = "#64b358";
          ctx.lineWidth = 27;
          ctx.beginPath();
          ctx.moveTo(hand.side * 76, -36);
          ctx.quadraticCurveTo(
            hand.side * 132,
            -12,
            hand.x,
            hand.y
          );
          ctx.stroke();

          // 巨拳
          ctx.fillStyle = "#6fbd60";
          ctx.strokeStyle = "#173725";
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(hand.x, hand.y, 29, 0, TAU);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = "#d2c487";
          for (let f = -1; f <= 1; f += 1) {
            ctx.beginPath();
            ctx.ellipse(
              hand.x + f * 11,
              hand.y + hand.side * 0 + 23,
              5.5,
              8,
              0,
              0,
              TAU
            );
            ctx.fill();
          }
        }

        // 头部
        const headGradient = ctx.createRadialGradient(
          -28,
          -172,
          5,
          0,
          -137,
          100
        );
        headGradient.addColorStop(0, "#a8e680");
        headGradient.addColorStop(0.5, "#76c663");
        headGradient.addColorStop(1, "#438442");
        ctx.fillStyle = headGradient;
        ctx.strokeStyle = "#173725";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.ellipse(0, -134, 92, 84, 0, 0, TAU);
        ctx.fill();
        ctx.stroke();

        // 耳朵
        ctx.fillStyle = "#6fbd60";
        for (const side of [-1, 1]) {
          ctx.beginPath();
          ctx.ellipse(side * 91, -135, 21, 34, side * 0.3, 0, TAU);
          ctx.fill();
          ctx.stroke();
        }

        // 乱发与尖角
        ctx.strokeStyle = "#294a2f";
        ctx.lineWidth = 5;
        ctx.lineCap = "round";
        for (let i = -2; i <= 2; i += 1) {
          ctx.beginPath();
          ctx.moveTo(i * 25, -204);
          ctx.quadraticCurveTo(i * 30 - 8, -228, i * 33 - 16, -240);
          ctx.stroke();
        }

        // 王冠
        ctx.save();
        ctx.translate(0, -213);
        ctx.fillStyle = "#f4cf61";
        ctx.strokeStyle = "#8b5a18";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-66, 0);
        ctx.lineTo(-56, -42);
        ctx.lineTo(-28, -14);
        ctx.lineTo(0, -58);
        ctx.lineTo(28, -14);
        ctx.lineTo(56, -42);
        ctx.lineTo(66, 0);
        ctx.lineTo(55, 24);
        ctx.lineTo(-55, 24);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#d34f5b";
        for (const x of [-34, 0, 34]) {
          ctx.beginPath();
          ctx.arc(x, 7, 6, 0, TAU);
          ctx.fill();
        }
        ctx.restore();

        // 眼睛
        const eyeGlow = warning || boss.roarTimer > 0 ? 1 : 0.45;
        ctx.save();
        ctx.shadowColor = `rgba(255, 94, 78, ${0.5 + eyeGlow * 0.5})`;
        ctx.shadowBlur = 12 + eyeGlow * 15;
        ctx.fillStyle = "#ffdf8a";
        ctx.beginPath();
        ctx.ellipse(-33, -151, 18, 15, 0, 0, TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(33, -151, 18, 15, 0, 0, TAU);
        ctx.fill();
        ctx.fillStyle = "#ff5c57";
        ctx.beginPath();
        ctx.arc(-30, -151, 7, 0, TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(36, -151, 7, 0, TAU);
        ctx.fill();
        ctx.fillStyle = "#fff8d6";
        ctx.beginPath();
        ctx.arc(-34, -156, 2.5, 0, TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(32, -156, 2.5, 0, TAU);
        ctx.fill();
        ctx.restore();

        // 大嘴
        const mouthHeight = 24 + roar * 30;
        ctx.fillStyle = "#3b1721";
        ctx.strokeStyle = "#173725";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(0, -95, 43, mouthHeight, 0, 0, TAU);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#fff3cf";
        for (let i = -2; i <= 2; i += 1) {
          ctx.beginPath();
          ctx.moveTo(i * 15 - 6, -95 - mouthHeight + 4);
          ctx.lineTo(i * 15 + 6, -95 - mouthHeight + 4);
          ctx.lineTo(i * 15, -95 - mouthHeight + 20);
          ctx.closePath();
          ctx.fill();
        }
        ctx.fillStyle = "#ff8584";
        ctx.beginPath();
        ctx.ellipse(0, -79 + roar * 12, 25, 9 + roar * 5, 0, 0, TAU);
        ctx.fill();

        // 下巴与斑点
        ctx.fillStyle = "rgba(58, 112, 53, 0.6)";
        ctx.beginPath();
        ctx.ellipse(-56, -119, 12, 8, -0.4, 0, TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(49, -121, 10, 7, 0.5, 0, TAU);
        ctx.fill();

        // 蓄力感叹号
        if (warning) {
          ctx.save();
          ctx.globalAlpha = 0.55 + warningPulse * 0.4;
          drawText("!", 0, -278, {
            size: 30,
            weight: 900,
            color: "#ffcf72",
            align: "center",
            family: MONO_STACK,
            shadow: { color: "rgba(255, 98, 77, 0.9)", blur: 16 },
          });
          ctx.restore();
        }

        ctx.restore();
      }

      function drawBossProjectiles() {
        if (bossProjectiles.length === 0) return;

        ctx.save();
        ctx.globalCompositeOperation = "lighter";

        for (const projectile of bossProjectiles) {
          const giant = projectile.kind === "giant";
          const pulse = 0.88 + Math.sin(projectile.phase) * 0.12;
          const radius = projectile.radius;

          const tailLength = giant ? 90 : 54;
          const tail = ctx.createLinearGradient(
            projectile.x,
            projectile.y,
            projectile.x + tailLength,
            projectile.y
          );
          tail.addColorStop(0, giant ? "rgba(255, 198, 102, 0.52)" : "rgba(255, 119, 103, 0.36)");
          tail.addColorStop(1, "rgba(255, 94, 64, 0)");
          ctx.strokeStyle = tail;
          ctx.lineWidth = giant ? 20 : 9;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(projectile.x, projectile.y);
          ctx.lineTo(projectile.x + tailLength, projectile.y);
          ctx.stroke();

          const glow = ctx.createRadialGradient(
            projectile.x,
            projectile.y,
            1,
            projectile.x,
            projectile.y,
            radius * 1.25
          );
          glow.addColorStop(0, "rgba(255, 255, 231, 0.98)");
          glow.addColorStop(0.18, giant ? "rgba(255, 218, 122, 0.9)" : "rgba(255, 173, 116, 0.82)");
          glow.addColorStop(0.52, giant ? "rgba(255, 121, 77, 0.55)" : "rgba(255, 94, 84, 0.5)");
          glow.addColorStop(1, "rgba(255, 74, 64, 0)");
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(projectile.x, projectile.y, radius * 1.25, 0, TAU);
          ctx.fill();

          ctx.fillStyle = giant ? "#fff2bd" : "#ffe8c0";
          ctx.beginPath();
          ctx.arc(projectile.x, projectile.y, radius * 0.35, 0, TAU);
          ctx.fill();

          ctx.strokeStyle = giant
            ? "rgba(255, 202, 112, 0.9)"
            : "rgba(255, 150, 116, 0.85)";
          ctx.lineWidth = giant ? 2.5 : 1.5;
          ctx.beginPath();
          ctx.arc(
            projectile.x,
            projectile.y,
            radius * (1.02 + Math.sin(projectile.phase) * 0.05),
            0,
            TAU
          );
          ctx.stroke();

          if (giant) {
            for (let i = 0; i < 3; i += 1) {
              const angle = projectile.phase * 0.5 + (i / 3) * TAU;
              ctx.fillStyle = "rgba(255, 233, 162, 0.7)";
              ctx.beginPath();
              ctx.arc(
                projectile.x + Math.cos(angle) * radius * 0.7,
                projectile.y + Math.sin(angle) * radius * 0.7,
                3,
                0,
                TAU
              );
              ctx.fill();
            }
          }
        }

        ctx.restore();
      }

      // ---------------------------------------------------------------------
      // 能量球
      // ---------------------------------------------------------------------
      function updateProjectiles(dt) {
        for (let i = projectiles.length - 1; i >= 0; i -= 1) {
          const projectile = projectiles[i];
          projectile.life -= dt;
          projectile.phase += dt * 9;
          projectile.trail.unshift({ x: projectile.x, y: projectile.y });
          if (projectile.trail.length > 7) projectile.trail.pop();

          projectile.x += projectile.speed * dt;

          if (
            boss &&
            game.level === 4 &&
            !boss.defeated &&
            projectile.direction > 0 &&
            projectile.x + projectile.radius >= BOSS_X - 151 &&
            Math.abs(projectile.y - boss.y) < 225
          ) {
            const hitX = BOSS_X - 151;
            const hitY = projectile.y;
            addEnergy(1);
            burstParticles(hitX, hitY, "#ffd8a2", 12, {
              speed: 180,
              size: 4,
              life: 0.42,
              gravity: 75,
              drag: 0.93,
            });
            damageBoss(1 * BOSS_DAMAGE_MULTIPLIER, {
              type: "projectile",
              x: hitX,
              y: hitY,
            });
            projectiles.splice(i, 1);
            continue;
          }

          let hitZombie = null;
          for (const zombie of zombies) {
            const dx = Math.abs(projectile.x - zombie.x);
            const dy = Math.abs(projectile.y - zombie.y);
            if (
              dx <= projectile.radius + zombie.radius * 0.72 &&
              dy <= 34
            ) {
              hitZombie = zombie;
              break;
            }
          }

          if (hitZombie) {
            burstParticles(
              projectile.x,
              projectile.y,
              "#baffce",
              9,
              {
                speed: 165,
                size: 3.5,
                life: 0.36,
                gravity: 60,
                drag: 0.92,
              }
            );
            damageZombie(hitZombie, 1, {
              type: "projectile",
              direction: projectile.direction,
            });
            projectiles.splice(i, 1);
            continue;
          }

          if (
            projectile.life <= 0 ||
            projectile.x < -60 ||
            projectile.x > W + 60
          ) {
            projectiles.splice(i, 1);
          }
        }
      }

      function drawProjectiles() {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";

        for (const projectile of projectiles) {
          const pulse = 0.84 + Math.sin(projectile.phase) * 0.16;
          const tailX = projectile.x - projectile.direction * 48;

          const trailGradient = ctx.createLinearGradient(
            tailX,
            projectile.y,
            projectile.x,
            projectile.y
          );
          trailGradient.addColorStop(0, "rgba(94, 255, 179, 0)");
          trailGradient.addColorStop(0.55, "rgba(99, 255, 184, 0.34)");
          trailGradient.addColorStop(1, "rgba(226, 255, 240, 0.95)");

          ctx.strokeStyle = trailGradient;
          ctx.lineWidth = 7;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(tailX, projectile.y);
          ctx.lineTo(projectile.x, projectile.y);
          ctx.stroke();

          const glow = ctx.createRadialGradient(
            projectile.x,
            projectile.y,
            0,
            projectile.x,
            projectile.y,
            24 * pulse
          );
          glow.addColorStop(0, "rgba(240, 255, 246, 0.98)");
          glow.addColorStop(0.26, "rgba(126, 255, 194, 0.78)");
          glow.addColorStop(1, "rgba(76, 255, 163, 0)");
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(projectile.x, projectile.y, 24 * pulse, 0, TAU);
          ctx.fill();

          ctx.fillStyle = "#f4fff8";
          ctx.beginPath();
          ctx.arc(projectile.x, projectile.y, 5.3, 0, TAU);
          ctx.fill();

          ctx.strokeStyle = "rgba(202, 255, 222, 0.85)";
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.arc(projectile.x, projectile.y, 10.5 * pulse, 0, TAU);
          ctx.stroke();
        }

        ctx.restore();
      }

      // ---------------------------------------------------------------------
      // 大招冲击波、血包
      // ---------------------------------------------------------------------
      function updateShockwaves(dt) {
        for (let i = shockwaves.length - 1; i >= 0; i -= 1) {
          const wave = shockwaves[i];
          wave.age += dt;
          const progress = clamp(wave.age / wave.duration, 0, 1);
          wave.radius =
            18 + easeOutQuad(progress) * (wave.maxRadius - 18);

          for (let j = zombies.length - 1; j >= 0; j -= 1) {
            const zombie = zombies[j];
            if (wave.hit.has(zombie)) continue;
            const distance = Math.hypot(
              zombie.x - wave.x,
              zombie.y - wave.y
            );
            if (distance <= wave.radius) {
              wave.hit.add(zombie);
              burstParticles(zombie.x, zombie.y - 9, "#fff2a8", 12, {
                speed: 210,
                size: 4.2,
                life: 0.5,
                gravity: 80,
                drag: 0.93,
              });
              damageZombie(zombie, wave.damage, {
                type: "ultimate",
                direction: wave.direction,
              });
            }
          }

          if (boss && !wave.hit.has(boss)) {
            const bossDistance = Math.hypot(
              BOSS_X - wave.x,
              BOSS_Y - wave.y
            );
            if (wave.radius >= bossDistance - 150) {
              wave.hit.add(boss);
              damageBoss(wave.damage * BOSS_DAMAGE_MULTIPLIER, {
                type: "ultimate",
                x: BOSS_X - 120,
                y: BOSS_Y - 30,
              });
            }
          }

          if (wave.age >= wave.duration) {
            shockwaves.splice(i, 1);
          }
        }
      }

      function drawShockwaves() {
        if (shockwaves.length === 0) return;

        ctx.save();
        ctx.globalCompositeOperation = "lighter";

        for (const wave of shockwaves) {
          const progress = clamp(wave.age / wave.duration, 0, 1);
          const alpha = Math.pow(1 - progress, 1.25);
          const radius = wave.radius;

          ctx.save();
          ctx.translate(wave.x, wave.y);

          const centerGlow = ctx.createRadialGradient(
            0,
            0,
            10,
            0,
            0,
            Math.max(80, radius * 0.5)
          );
          centerGlow.addColorStop(0, `rgba(255, 246, 188, ${alpha * 0.3})`);
          centerGlow.addColorStop(0.5, `rgba(255, 222, 94, ${alpha * 0.1})`);
          centerGlow.addColorStop(1, "rgba(255, 220, 90, 0)");
          ctx.fillStyle = centerGlow;
          ctx.beginPath();
          ctx.arc(0, 0, Math.max(80, radius * 0.5), 0, TAU);
          ctx.fill();

          ctx.strokeStyle = `rgba(255, 239, 157, ${alpha * 0.9})`;
          ctx.lineWidth = 4 + (1 - progress) * 9;
          ctx.shadowColor = "rgba(255, 232, 115, 0.85)";
          ctx.shadowBlur = 26;
          ctx.beginPath();
          ctx.arc(0, 0, radius, 0, TAU);
          ctx.stroke();

          ctx.shadowBlur = 0;
          ctx.strokeStyle = `rgba(255, 255, 240, ${alpha * 0.8})`;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 0, Math.max(0, radius - 1), 0, TAU);
          ctx.stroke();

          ctx.strokeStyle = `rgba(149, 255, 195, ${alpha * 0.54})`;
          ctx.lineWidth = 1.5 + (1 - progress) * 3;
          ctx.beginPath();
          ctx.arc(0, 0, Math.max(0, radius - 16), 0, TAU);
          ctx.stroke();

          ctx.strokeStyle = `rgba(255, 255, 227, ${alpha * 0.32})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(0, 0, Math.max(0, radius * 0.78), 0, TAU);
          ctx.stroke();

          ctx.restore();
        }

        ctx.restore();
      }

      function updateHealthPacks(dt) {
        for (let i = healthPacks.length - 1; i >= 0; i -= 1) {
          const pack = healthPacks[i];
          pack.age += dt;

          if (
            player.hp < player.maxHp &&
            Math.hypot(player.x - pack.x, player.y - pack.baseY) <
              player.radius + HEALTH_PACK_RADIUS + 12
          ) {
            player.hp = Math.min(player.maxHp, player.hp + 1);
            healthPacks.splice(i, 1);
            sfxHealthPack();

            addFloater(
              "+1 生命",
              player.x,
              player.y - 70,
              "#a8ffc6",
              19
            );
            burstParticles(player.x, player.y - 10, "#ff94a8", 14, {
              speed: 155,
              size: 3.8,
              life: 0.52,
              gravity: -15,
              drag: 0.94,
            });
            burstParticles(player.x, player.y - 10, "#b6ffd1", 10, {
              speed: 110,
              size: 3,
              life: 0.44,
              gravity: -20,
              drag: 0.94,
            });
            game.shake = Math.max(game.shake, 2);
          }
        }
      }

      function drawHealthPacks() {
        for (const pack of healthPacks) {
          const bob = Math.sin(pack.age * 3.4 + pack.phase) * 3;
          const drawY = pack.baseY - 17 + bob;
          const pulse = 0.72 + Math.sin(pack.age * 4.2 + pack.phase) * 0.2;

          ctx.save();
          ctx.globalAlpha = 0.34;
          ctx.fillStyle = "#000000";
          ctx.beginPath();
          ctx.ellipse(pack.x, pack.baseY + 5, 20, 6, 0, 0, TAU);
          ctx.fill();
          ctx.restore();

          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          const glow = ctx.createRadialGradient(
            pack.x,
            drawY,
            1,
            pack.x,
            drawY,
            39
          );
          glow.addColorStop(0, `rgba(255, 134, 157, ${0.22 * pulse})`);
          glow.addColorStop(0.5, `rgba(255, 90, 120, ${0.09 * pulse})`);
          glow.addColorStop(1, "rgba(255, 90, 120, 0)");
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(pack.x, drawY, 39, 0, TAU);
          ctx.fill();
          ctx.restore();

          ctx.save();
          ctx.translate(pack.x, drawY);
          ctx.rotate(Math.sin(pack.age * 2.1 + pack.phase) * 0.06);

          // 小提手
          ctx.strokeStyle = "#6f1f31";
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(0, -13, 7.5, Math.PI, TAU);
          ctx.stroke();

          // 血包本体
          const bagGradient = ctx.createLinearGradient(0, -14, 0, 15);
          bagGradient.addColorStop(0, "#ff8ba0");
          bagGradient.addColorStop(0.5, "#ef5f7d");

          roundRectPath(-17, -13, 34, 28, 8);
          ctx.fillStyle = bagGradient;
          ctx.fill();
          ctx.strokeStyle = "#6f1f31";
          ctx.lineWidth = 2.2;
          ctx.stroke();

          // 白十字
          ctx.fillStyle = "#fff8ee";
          ctx.shadowColor = "rgba(255, 245, 235, 0.6)";
          ctx.shadowBlur = 6;
          roundRectPath(-3.1, -8.5, 6.2, 18, 1.8);
          ctx.fill();
          roundRectPath(-9, -2.4, 18, 6.2, 1.8);
          ctx.fill();
          ctx.shadowBlur = 0;

          // 高光
          ctx.strokeStyle = "rgba(255, 255, 255, 0.38)";
          ctx.lineWidth = 1.3;
          ctx.beginPath();
          ctx.moveTo(-10, -9);
          ctx.quadraticCurveTo(-14, -2, -11, 7);

        }

      // ---------------------------------------------------------------------
      // 背景与场景
      // ---------------------------------------------------------------------
      function drawBackground() {
        const sky = ctx.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, "#06111d");
        sky.addColorStop(0.44, "#0a1d22");
        sky.addColorStop(1, "#071715");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, H);

        // 星星
        for (const star of stars) {
          const twinkle =
            0.35 + 0.65 * (0.5 + 0.5 * Math.sin(sceneTime * star.speed + star.phase));
          ctx.globalAlpha = star.a * twinkle;
          ctx.fillStyle = "#d8ffe9";
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.r, 0, TAU);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        ctx.fillRect(0, 96, W, 114);

        ctx.fillStyle = "rgba(3, 13, 15, 0.7)";
        ctx.beginPath();
        ctx.moveTo(0, 138);
        ctx.lineTo(0, 120);
        ctx.quadraticCurveTo(110, 95, 250, 126);
        ctx.quadraticCurveTo(410, 72, 560, 122);
        ctx.quadraticCurveTo(720, 90, 880, 126);
        ctx.quadraticCurveTo(1050, 82, 1280, 120);
        ctx.lineTo(1280, 138);
        ctx.closePath();
        ctx.fill();
      }

      function drawArena() {
        ctx.save();
        roundRectPath(ARENA.x, ARENA.y, ARENA.w, ARENA.h, 20);
        ctx.clip();

        const ground = ctx.createLinearGradient(
          0,
          ARENA.y,
          0,
          ARENA.bottom
        );
        ground.addColorStop(0, "#1b473b");
        ground.addColorStop(0.48, "#143a32");
        ground.addColorStop(1, "#0d2b26");
        ctx.fillStyle = ground;
        ctx.fillRect(ARENA.x, ARENA.y, ARENA.w, ARENA.h);

        // 五条跑道
        for (let i = 0; i < LANE_COUNT; i += 1) {
          const laneY = ARENA.y + i * LANE_H;
          const wash = ctx.createLinearGradient(0, laneY, 0, laneY + LANE_H);
          if (i % 2 === 0) {
            wash.addColorStop(0, "rgba(141, 255, 187, 0.085)");
            wash.addColorStop(0.55, "rgba(84, 183, 129, 0.04)");
            wash.addColorStop(1, "rgba(0, 0, 0, 0.018)");
          } else {
            wash.addColorStop(0, "rgba(0, 0, 0, 0.1)");
            wash.addColorStop(0.55, "rgba(0, 0, 0, 0.04)");
            wash.addColorStop(1, "rgba(127, 235, 173, 0.042)");
          }
          ctx.fillStyle = wash;
          ctx.fillRect(ARENA.x, laneY, ARENA.w, LANE_H);
        }

        // 跑道分隔线
        for (let i = 1; i < LANE_COUNT; i += 1) {
          const y = ARENA.y + i * LANE_H;
          const lineGradient = ctx.createLinearGradient(
            ARENA.x,
            y,
            ARENA.right,
            y
          );
          lineGradient.addColorStop(0, "rgba(157, 255, 191, 0.03)");
          lineGradient.addColorStop(0.16, "rgba(185, 255, 207, 0.33)");
          lineGradient.addColorStop(0.84, "rgba(185, 255, 207, 0.28)");
          lineGradient.addColorStop(1, "rgba(157, 255, 191, 0.03)");
          ctx.strokeStyle = lineGradient;
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(ARENA.x, y + 0.5);
          ctx.lineTo(ARENA.right, y + 0.5);
          ctx.stroke();
        }

        // 跑道中心虚线
        ctx.save();
        ctx.setLineDash([3, 22]);
        ctx.lineDashOffset = -sceneTime * 17;
        ctx.strokeStyle = "rgba(180, 255, 208, 0.17)";
        ctx.lineWidth = 1.5;
        for (let i = 0; i < LANE_COUNT; i += 1) {
          const y = laneCenter(i);
          ctx.beginPath();
          ctx.moveTo(ARENA.x + 70, y);
          ctx.lineTo(ARENA.right - 70, y);
          ctx.stroke();
        }
        ctx.restore();

        // 石子
        for (const pebble of pebbles) {
          ctx.fillStyle = `rgba(201, 255, 218, ${pebble.a})`;
          ctx.beginPath();
          ctx.ellipse(
            pebble.x,
            pebble.y,
            pebble.w,
            pebble.h,
            -0.25,
            0,
            TAU
          );
          ctx.fill();
        }

        // 跑道编号
        for (let i = 0; i < LANE_COUNT; i += 1) {
          drawText(String(i + 1).padStart(2, "0"), ARENA.x + 16, laneCenter(i) + 3, {
            size: 8,
            weight: 700,
            color: "rgba(176, 255, 207, 0.3)",
            family: MONO_STACK,
          });
        }

        // 两侧的出生雾气
        const leftMist = ctx.createLinearGradient(
          ARENA.x,
          0,
          ARENA.x + 126,
          0
        );
        leftMist.addColorStop(0, "rgba(96, 255, 158, 0.16)");
        leftMist.addColorStop(0.32, "rgba(75, 220, 135, 0.055)");
        leftMist.addColorStop(1, "rgba(75, 220, 135, 0)");
        ctx.fillStyle = leftMist;
        ctx.fillRect(ARENA.x, ARENA.y, 126, ARENA.h);

        const rightMist = ctx.createLinearGradient(
          ARENA.right - 126,
          0,
          ARENA.right,
          0
        );
        rightMist.addColorStop(0, "rgba(96, 255, 158, 0)");
        rightMist.addColorStop(0.68, "rgba(75, 220, 135, 0.055)");
        rightMist.addColorStop(1, "rgba(96, 255, 158, 0.16)");
        ctx.fillStyle = rightMist;
        ctx.fillRect(ARENA.right - 126, ARENA.y, 126, ARENA.h);

        // 缓慢飘动的雾带
        for (let i = 0; i < 3; i += 1) {
          const fogY =
            ARENA.y +
            ARENA.h * (0.23 + i * 0.26) +
            Math.sin(sceneTime * 0.22 + i * 2.1) * 13;
          const fogGradient = ctx.createLinearGradient(
            ARENA.x,
            fogY,
            ARENA.right,
            fogY
          );
          fogGradient.addColorStop(0, "rgba(149, 255, 192, 0)");
          fogGradient.addColorStop(0.24, "rgba(149, 255, 192, 0.035)");
          fogGradient.addColorStop(0.68, "rgba(117, 235, 179, 0.055)");
          fogGradient.addColorStop(1, "rgba(149, 255, 192, 0)");
          ctx.fillStyle = fogGradient;
          ctx.fillRect(
            ARENA.x,
            fogY,
            ARENA.w,
            34 + Math.sin(sceneTime * 0.3 + i) * 8
          );
        }

        // 两侧草丛
        for (const tuft of grassTufts) {
          ctx.strokeStyle = "rgba(79, 158, 101, 0.35)";
          ctx.lineWidth = 1.2;
          ctx.lineCap = "round";
          for (let blade = 0; blade < 3; blade += 1) {
            ctx.beginPath();
            ctx.moveTo(tuft.x, tuft.y);
            ctx.quadraticCurveTo(
              tuft.x + tuft.lean * 5 + blade * 2 - 2,
              tuft.y - tuft.size * 0.55,
              tuft.x + tuft.lean * 9 + blade * 4 - 4,
              tuft.y - tuft.size
            );
            ctx.stroke();
          }
        }

        // 底部暗角
        const shade = ctx.createLinearGradient(
          0,
          ARENA.bottom - 48,
          0,
          ARENA.bottom
        );
        shade.addColorStop(0, "rgba(1, 8, 8, 0)");
        shade.addColorStop(1, "rgba(1, 8, 8, 0.4)");
        ctx.fillStyle = shade;
        ctx.fillRect(ARENA.x, ARENA.bottom - 48, ARENA.w, 48);

        ctx.restore();

        // 外框
        roundRectPath(ARENA.x, ARENA.y, ARENA.w, ARENA.h, 20);
        ctx.strokeStyle = "rgba(151, 255, 190, 0.26)";
        ctx.lineWidth = 1.6;
        ctx.stroke();

        roundRectPath(
          ARENA.x + 3,
          ARENA.y + 3,
          ARENA.w - 6,
          ARENA.h - 6,
          17
        );
        ctx.strokeStyle = "rgba(5, 21, 18, 0.74)";
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      function drawFireflies() {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";

        for (const fly of fireflies) {
          const x =
            fly.x +
            Math.sin(sceneTime * fly.speed + fly.phase) * fly.driftX;
          const y =
            fly.y +
            Math.cos(sceneTime * fly.speed * 0.72 + fly.phase) * fly.driftY;
          const pulse =
            0.22 + 0.6 * (0.5 + 0.5 * Math.sin(sceneTime * 1.8 + fly.phase));

          const glow = ctx.createRadialGradient(x, y, 0, x, y, 13);
          glow.addColorStop(0, `rgba(209, 255, 157, ${pulse})`);
          glow.addColorStop(0.28, `rgba(141, 255, 154, ${pulse * 0.4})`);
          glow.addColorStop(1, "rgba(97, 255, 145, 0)");
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(x, y, 13, 0, TAU);
          ctx.fill();

          ctx.fillStyle = `rgba(242, 255, 195, ${pulse * 0.92})`;
          ctx.beginPath();
          ctx.arc(x, y, fly.radius, 0, TAU);
          ctx.fill();
        }

        ctx.restore();
      }

      function drawParticles() {
        ctx.save();
        for (const particle of particles) {
          const alpha = clamp(particle.life / particle.maxLife, 0, 1);
          ctx.globalAlpha = alpha;
          ctx.globalCompositeOperation = particle.glow ? "lighter" : "source-over";
          ctx.fillStyle = particle.color;
          ctx.save();
          ctx.translate(particle.x, particle.y);
          ctx.rotate(particle.rotation);
          if (particle.shape === "square") {
            ctx.fillRect(
              -particle.size / 2,
              -particle.size / 2,
              particle.size,
              particle.size
            );
          } else if (particle.shape === "shard") {
            ctx.beginPath();
            ctx.moveTo(0, -particle.size);
            ctx.lineTo(particle.size * 0.5, particle.size);
            ctx.lineTo(-particle.size * 0.55, particle.size * 0.35);
            ctx.closePath();
            ctx.fill();
          } else {
            ctx.beginPath();
            ctx.arc(0, 0, particle.size, 0, TAU);
            ctx.fill();
          }
          ctx.restore();
        }
        ctx.restore();
      }

      function drawFloaters() {
        ctx.save();
        for (const floater of floaters) {
          const alpha = clamp(floater.life / floater.maxLife, 0, 1);
          const scale = 1 + (1 - alpha) * 0.22;
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.translate(floater.x, floater.y);
          ctx.scale(scale, scale);
          ctx.font = `900 ${floater.size}px ${floater.family}`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.lineWidth = 4;
          ctx.strokeStyle = "rgba(4, 17, 14, 0.78)";
          ctx.strokeText(floater.text, 0, 0);
          ctx.fillStyle = floater.color;
          ctx.fillText(floater.text, 0, 0);
          ctx.restore();
        }
        ctx.restore();
      }

        );
        const ratio = game.levelTotal
          ? clamp(game.levelKills / game.levelTotal, 0, 1)
          : 0;

        fillPanel(
          1056,

        let alpha = 1;
        if (progress < 0.08) alpha = progress / 0.08;
        if (game.introTimer < 0.7) alpha = game.introTimer / 0.7;

      function drawVignette() {
        const vignette = ctx.createRadialGradient(
          W / 2,
          H / 2,
          H * 0.24,
          W / 2,
          H / 2,
          W * 0.72
        );
        vignette.addColorStop(0, "rgba(0, 0, 0, 0)");
        vignette.addColorStop(0.64, "rgba(0, 0, 0, 0.06)");
        vignette.addColorStop(1, "rgba(0, 0, 0, 0.42)");
        ctx.fillStyle = vignette;
        ctx.fillRect(0, 0, W, H);

        if (player.hp <= 3 && game.status === "playing") {
          const pulse = 0.08 + Math.sin(sceneTime * 4.2) * 0.035;
          const dangerVignette = ctx.createRadialGradient(
            W / 2,
            H / 2,
            H * 0.35,
            W / 2,
            H / 2,
            W * 0.68
          );
          dangerVignette.addColorStop(0, "rgba(255, 40, 60, 0)");
          dangerVignette.addColorStop(1, `rgba(255, 35, 60, ${pulse})`);

      // ---------------------------------------------------------------------
      // 主循环
      // ---------------------------------------------------------------------
      function update(dt) {
        game.introTimer = Math.max(0, game.introTimer - dt);
        game.shake = Math.max(0, game.shake - dt * 34);
        game.damageFlash = Math.max(0, game.damageFlash - dt);
        game.ultimateFlash = Math.max(0, game.ultimateFlash - dt);
        game.roarFlash = Math.max(0, game.roarFlash - dt);

        player.hpDisplay += (player.hp - player.hpDisplay) * Math.min(1, dt * 11);
        if (Math.abs(player.hp - player.hpDisplay) < 0.01) {
          player.hpDisplay = player.hp;
        }

        if (game.paused) return;

        updateParticles(dt);
        updateFloaters(dt);

        if (game.status === "dead") {
          game.deathTimer += dt;
          return;
        }

        if (game.status === "victory") {
          game.victoryTimer += dt;
          return;
        }

        if (game.levelIntroTimer > 0) {
          game.levelIntroTimer = Math.max(0, game.levelIntroTimer - dt);
          return;
        }

        game.time += dt;
        updatePlayer(dt);
        updateProjectiles(dt);
        updateShockwaves(dt);
        updateZombies(dt);
        updateBoss(dt);
        updateBossProjectiles(dt);
        updateHealthPacks(dt);

        if (game.level < 4 && game.spawnQueue.length > 0) {
          game.spawnTimer -= dt;
          if (game.spawnTimer <= 0) {
            if (zombies.length >= MAX_ZOMBIES) {
              game.spawnTimer = 0.35;
            } else if (!spawnZombie()) {
              game.spawnTimer = 0.4;
            }
          }
        }

        checkLevelClear();
      }

      function drawScene() {
        drawBackground();

        let shakeX = 0;
        let shakeY = 0;
        if (game.shake > 0.1) {
          const magnitude = Math.min(12, game.shake);
          shakeX = rand(-magnitude, magnitude);
          shakeY = rand(-magnitude, magnitude);
        }

        ctx.save();
        ctx.translate(shakeX, shakeY);
        drawArena();
        drawFireflies();
        drawBoss();
        drawProjectiles();

        const orderedZombies = [...zombies].sort((a, b) => a.y - b.y);
        for (const zombie of orderedZombies) {
          drawZombie(zombie);
        }

        drawHealthPacks();
        drawBossProjectiles();
        drawShockwaves();
        drawPlayer();
        drawParticles();
        drawFloaters();
        drawIntroHint();
        ctx.restore();

        drawVignette();
      }

      function drawMuteButton() {
        const { x, y, w, h } = muteButton;
        const accent = audioMuted ? "#ff968d" : "rgba(205, 255, 224, 0.88)";

        fillPanel(
          x,
          y,
          w,
          h,
          8,
          audioMuted
            ? "rgba(255, 100, 95, 0.12)"
            : "rgba(124, 255, 177, 0.07)",
          audioMuted
            ? "rgba(255, 145, 136, 0.38)"
            : "rgba(157, 255, 193, 0.2)",
          1
        );

        ctx.save();
        ctx.translate(x + w / 2, y + h / 2);
        ctx.fillStyle = accent;

        // 喇叭本体
        ctx.beginPath();
        ctx.moveTo(-8, -3.5);
        ctx.lineTo(-4.2, -3.5);
        ctx.lineTo(0.8, -8);
        ctx.lineTo(0.8, 8);
        ctx.lineTo(-4.2, 3.5);
        ctx.lineTo(-8, 3.5);
        ctx.closePath();
        ctx.fill();

        if (!audioMuted) {
          ctx.strokeStyle = accent;
          ctx.lineWidth = 1.5;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.arc(2.3, 0, 5.2, -0.8, 0.8);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(2.3, 0, 9.2, -0.7, 0.7);
          ctx.stroke();
        } else {
          ctx.strokeStyle = "#ff968d";
          ctx.lineWidth = 2;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(-9, 9);
          ctx.lineTo(9.5, -9.5);
          ctx.stroke();
        }

        ctx.restore();
      }

      function render() {
        ctx.clearRect(0, 0, W, H);
        drawScene();
        drawHeader();
        drawFooter();

        if (game.levelIntroTimer > 0 && game.status === "playing") {
          drawLevelIntro();
        }
        if (game.paused) drawPauseOverlay();
        if (game.status === "dead") drawGameOverOverlay();
        if (game.status === "victory") drawVictoryOverlay();

        drawMuteButton();
      }

      function frame(timestamp) {
        if (!lastTimestamp) lastTimestamp = timestamp;
        let dt = (timestamp - lastTimestamp) / 1000;
        lastTimestamp = timestamp;

        if (!Number.isFinite(dt) || dt < 0) dt = 0;
        dt = Math.min(dt, 1 / 30);
        sceneTime += dt;

        update(dt);
        render();

        requestAnimationFrame(frame);
      }

      // 调试接口：便于在控制台观察状态，也方便后续步骤扩展。
      window.__milkFrog = {
        get snapshot() {
          return {
            status: game.status,
            paused: game.paused,
            time: game.time,
            kills: game.kills,
            victoryTimer: game.victoryTimer,
            level: game.level,
            levelTotal: game.levelTotal,
            levelKills: game.levelKills,
            levelSpawned: game.levelSpawned,
            levelRemaining: Math.max(0, game.levelTotal - game.levelKills),
            levelIntroTimer: game.levelIntroTimer,
            spawnQueue: game.spawnQueue.reduce((counts, type) => {
              counts[type] = (counts[type] || 0) + 1;
              return counts;
            }, {}),
            imageReady: frogImageReady,
            laughReady: frogLaughReady,
            audioState: audioContext ? audioContext.state : "uninitialized",
            audioMuted,
            audioUnlocked,
            masterVolume: audioMaster ? audioMaster.gain.value : null,
            dashAudioReady: dashAudio.readyState,
            laughAudioReady: laughAudio.readyState,
            dashAudioDuration: Number.isFinite(dashAudio.duration)
              ? dashAudio.duration
              : 0,
            laughAudioDuration: Number.isFinite(laughAudio.duration)
              ? laughAudio.duration
              : 0,
            dashAudioEmbedded: dashAudioUsingEmbedded,
            laughAudioEmbedded: laughAudioUsingEmbedded,
            dashAudioPlaying: !dashAudio.paused,
            laughAudioPlaying: !laughAudio.paused,
            dashAudioTime: dashAudio.currentTime,
            laughAudioTime: laughAudio.currentTime,
            hp: player.hp,
            invulnerable: player.invulnerable,
            stunTimer: player.stunTimer,
            energy: player.energy,
            energyDisplay: player.energyDisplay,
            ultimateTimer: player.ultimateTimer,
            dashTimer: player.dashTimer,
            dashCooldown: player.dashCooldown,
            lane: player.lane,
            x: player.x,
            y: player.y,
            facing: player.facing,
            boss: boss
              ? {
                  hp: boss.hp,
                  maxHp: boss.maxHp,
                  attackTimer: boss.attackTimer,
                  attackIndex: boss.attackIndex,
                  volleyRemaining: boss.volleyRemaining,
                  defeated: boss.defeated,
                  x: boss.x,
                  y: boss.y,
                }
              : null,
            bossProjectiles: bossProjectiles.map((projectile) => ({
              kind: projectile.kind,
              x: projectile.x,
              y: projectile.y,
              damage: projectile.damage,
            })),
            shockwaves: shockwaves.length,
            healthPacks: healthPacks.map((pack) => ({
              x: pack.x,
              y: pack.baseY,
            })),
            zombies: zombies.map((zombie) => ({
              type: zombie.type,
              x: zombie.x,
              y: zombie.y,
              lane: zombie.lane,
              hp: zombie.hp,
              maxHp: zombie.maxHp,
              speed: zombie.speed,
            })),
            projectiles: projectiles.map((projectile) => ({
              x: projectile.x,
              y: projectile.y,
            })),
          };
        },
        fire: fireProjectile,
        hurt: () => hurtPlayer(1),
        addEnergy,
        ultimate: triggerUltimate,
        dash: triggerDash,
        spawnZombie,
        spawnHealthPack,
        startLevel,
        damageBoss,
        bossAttack: performBossAttack,
        setBossAttackTimer: (value) => {
          if (boss) boss.attackTimer = value;
        },
        toggleMute: toggleAudioMute,
        forceLevelClear: () => {
          if (game.level >= 4) return;
          game.levelSpawned = game.levelTotal;
          game.levelKills = game.levelTotal;
          game.spawnQueue = [];
          zombies = [];
          checkLevelClear();
        },
        reset: resetGame,
      };

      startLevel(1, { initial: true });
      syncMobileLayout();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
